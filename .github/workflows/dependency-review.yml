name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: Revisar dependencias
    # GitHub's dependency-review API returns 403 for fork repositories.
    # Keep enforcement enabled for standalone/upstream installations.
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Revisar cambios de dependencias
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
